
# Application name
spring.application.name=handling-form-submission

# Set the default logging level
logging.level.root=INFO

# Set logging level for the Greeting application
logging.level.com.example.handlingformsubmission=INFO

# Display timestamps, logging levels, and messages
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

